version: 1

scope:
  include:
    - lib/**
    - app/api/**
    - app/dashboard/**
    - app/page.tsx
    - app/HomeScene.tsx
    - db/**
  exclude:
    - node_modules/**
    - dist/**
    - .wrangler/**
    - design-qa-evidence/**

repowiki:
  template: architecture
  notes:
    - text: >-
        AgentBento 是隐私优先的日本居家养老关怀系统。核心数据流：
        ESP32-S3 → Nosana(边缘去噪/FFT/初筛，隐私不出户) →
        GMI Cloud(CSI 活动状态置信度推理) →
        Qwen Cloud(Agent 分级决策 NORMAL→WATCH→CHECK_IN→ESCALATE + 日文配送指令) →
        ai&(日本国内 GPU，隐私评估，数据不出境)。
        Daytona 负责全栈线上部署。Qoder 负责代码质量扫描。
        RuView 是真实 WiFi CSI 硬件平台（ESP32-S3 + Docker localhost:3000）。
    - text: >-
        所有适配器都实现了 fallback 降级机制，确保在任意 API Key 缺失时 demo 仍能运行。
        降级链优先级：Nosana(本地软件处理) → GMI(启发式估算) → Qwen(规则阈值) → ai&(默认文化语境)。
    - text: >-
        WiFi CSI (Channel State Information) 是通过 2.4GHz WiFi 信号的振幅和相位变化
        检测人体活动的技术。30 个 subcarrier，100Hz 采样率。
        呼吸频段 0.1-0.5Hz，心跳频段 0.8-2.0Hz。硬件成本约 $9/节点（ESP32-S3）。

  documents:
    - title: 系统架构总览
      goal: 描述六服务协同架构、数据流方向、隐私边界划分
      hints:
        - 画出 ESP32 → 边缘 → 云端 → 决策 的完整数据流
        - 标注隐私边界（户内/户外、日本国内/国外）
        - 列出每层降级策略
      template: |
        ## 架构概述
        ## 数据流与隐私边界
        ## 服务依赖关系
        ## 降级策略

    - title: AI Router 路由机制
      goal: 解释 ai-router.ts 的 runCareFlow 端到端流水线实现
      parent: 系统架构总览
      hints:
        - 描述 runCareFlow 的 5 步流水线
        - 解释 fallbackDecision 的阈值规则
        - 说明 pipeline 数组如何追踪执行路径

    - title: 适配器层设计
      goal: 描述 6 个适配器的统一设计模式（配置/类型/调用/fallback）
      hints:
        - 每个适配器的核心导出函数
        - 共同的错误处理模式
        - 环境变量配置约定

    - title: CSI 信号处理流水线
      goal: 从 ESP32 原始帧到活动状态推断的完整技术路径
      parent: 适配器层设计
      hints:
        - Nosana 边缘处理：去噪(movingAverage) + FFT + 相位解包
        - GMI 云端推理：特征提取 + 活动分类
        - 呼吸率/心率估算算法
        - 运动初筛阈值与边缘告警逻辑

    - title: Dashboard 与 API 层
      goal: 描述前端看板与 API 路由如何消费 AI 流水线输出
      hints:
        - /api/incident/check-in 端到端流程
        - ServiceStatusPanel 如何展示六服务状态
        - 模拟 CSI 数据的生成方式（demo 模式）

knowledgecard:
  notes:
    - text: >-
        6 个服务适配器统一模式：getXxxConfig() 读环境变量 → isXxxConfigured() 守卫 →
        核心业务函数 → fallback 降级。所有函数返回类型化结果，不抛异常到调用方。
    - text: >-
        ai-router.ts 的 runCareFlow 是唯一端到端入口。
        5 步流水线：Nosana(边缘) → GMI(推理) → Qwen(决策) → ai&(文化+隐私) → Qwen(配送指令)。
        每步都有 try/catch + fallback，pipeline 数组记录实际执行路径供调试。
    - text: >-
        隐私设计原则：原始 CSI 数据永远不离开 ESP32 设备（Nosana 层）。
        仅上传 10 维特征向量 + 统计摘要到云端。
        日本居民数据仅由 ai& 在日本国内 GPU 处理，不传至海外服务。
    - text: >-
        CSI 数据规格：30 subcarriers × 100Hz 采样率。振幅(amplitude) + 相位(phase) 双通道。
        呼吸频段 0.1-0.5Hz，心跳频段 0.8-2.0Hz。FFT 后用频段能量估算 BPM。
    - text: >-
        黑客松 demo 模式：所有 API 接受 mockCsiFrames 参数，不传则自动生成随机数据。
        降级到纯规则引擎（fallbackDecision），无需任何 API Key 即可演示完整流程。
